plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-parcelize'
    id 'com.google.gms.google-services'
}
android {
    compileSdkVersion 35
    buildToolsVersion "34.0.0"
    namespace 'com.example.instagram'

    defaultConfig {
        applicationId "com.example.instagram"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        multiDexEnabled = true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    viewBinding {
        enabled = true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}


dependencies {
// Upgraded Dependencies
//    implementation 'com.github.CanHub:Android-Image-Cropper:4.3.2' // New version maintained fork

    implementation 'com.github.dhaval2404:imagepicker:2.1'

// Kotlin Standard Library
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.1.20"

// Circular Image View
    implementation 'de.hdodenhof:circleimageview:3.1.0'

// Picasso (Latest)
    implementation 'com.squareup.picasso:picasso:2.71828'

// Image Cropper (Upgraded to Maintained Version)
//    implementation 'com.github.CanHub:Android-Image-Cropper:4.3.0'

// Multidex
    implementation 'androidx.multidex:multidex:2.0.1'

// AndroidX Core
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    // Firebase

    // Firebase SDKs with Firebase BOM
    implementation platform('com.google.firebase:firebase-bom:33.13.0')  // Firebase BOM for version management
    implementation 'com.google.firebase:firebase-auth'  // Firebase Authentication SDK
    implementation 'com.google.firebase:firebase-analytics-ktx'  // Firebase Analytics SDK
    implementation 'com.google.firebase:firebase-database-ktx'  // Firebase Realtime Database SDK
    implementation 'com.google.firebase:firebase-storage-ktx'  // Firebase Storage SDK
// Glide (Latest)
    implementation 'com.github.bumptech.glide:glide:4.15.1'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.15.1'

// Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.0'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.0'

// Shared Preferences (DataStore)
    implementation 'androidx.datastore:datastore-preferences:1.1.6'
    implementation 'androidx.datastore:datastore-preferences-core:1.1.6'

// Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

// Coroutine Lifecycle Scopes
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'

// Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

}